name: Build portable EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, feat/microsoft-store-msix ]
  pull_request:
    branches: [ main, feat/app-time-rules-beta-1 ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content PowerPlanTray.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'Version missing from project file' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test app and schedule rules
        run: dotnet run --project tests/Rules.Tests.csproj -c Release
      - name: Publish Codex edition
        shell: pwsh
        run: dotnet publish PowerPlanTray.csproj -c Release -r win-x64 --self-contained true -p:CodexEdition=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishDir="$env:RUNNER_TEMP/codex/"
      - name: Publish standard edition
        shell: pwsh
        run: dotnet publish PowerPlanTray.csproj -c Release -r win-x64 --self-contained true -p:CodexEdition=false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishDir="$env:RUNNER_TEMP/standard/"
      - name: Package both editions
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          Compress-Archive -Path "$env:RUNNER_TEMP/standard/PowerPlanTray.exe" -DestinationPath "PowerPlanTray-v$version.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/codex/PowerPlanTray.exe" -DestinationPath "PowerPlanTray-v$version-Codex.zip"
      - name: Upload standard ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PowerPlanTray-v${{ steps.version.outputs.value }}
          path: PowerPlanTray-v${{ steps.version.outputs.value }}.zip
      - name: Upload Codex ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PowerPlanTray-v${{ steps.version.outputs.value }}-Codex
          path: PowerPlanTray-v${{ steps.version.outputs.value }}-Codex.zip
