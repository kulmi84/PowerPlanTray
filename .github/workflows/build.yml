name: Build portable EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerPlanTray-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/PowerPlanTray.exe
